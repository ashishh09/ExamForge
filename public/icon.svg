<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- AI Neural Ring / Academic Halo -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="16 12"/>

  <!-- Academic Mortarboard / Graduation Cap Top -->
  <g filter="url(#glow)">
    <polygon points="256,110 406,190 256,268 106,190" fill="url(#capGrad)"/>
    
    <!-- Cap Under Skull Cap -->
    <path d="M168,222 L168,294 C168,342 344,342 344,294 L344,222 C318,242 288,252 256,252 C224,252 194,242 168,222 Z" fill="#cbd5e1"/>
    
    <!-- Tassel Button and String -->
    <circle cx="256" cy="190" r="10" fill="url(#goldGrad)"/>
    <path d="M256,190 Q320,205 352,248" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Tassel Fringe -->
    <polygon points="346,244 362,250 354,296 338,290" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Study Book / Exam Paper Base -->
  <g opacity="0.95">
    <path d="M136,368 C180,350 226,356 256,376 C286,356 332,350 376,368 L376,412 C332,394 286,400 256,420 C226,400 180,394 136,412 Z" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M256,376 L256,420" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Radiant AI 4-Point Sparkle / Forge Spark -->
  <g transform="translate(376, 120)">
    <path d="M0,-36 Q0,0 36,0 Q0,0 0,36 Q0,0 -36,0 Q0,0 0,-36 Z" fill="url(#sparkGrad)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
  </g>

  <!-- Small AI Sparkle 2 -->
  <g transform="translate(126, 140) scale(0.6)">
    <path d="M0,-30 Q0,0 30,0 Q0,0 0,30 Q0,0 -30,0 Q0,0 0,-30 Z" fill="#93c5fd"/>
  </g>
</svg>
